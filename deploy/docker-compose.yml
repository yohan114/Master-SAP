# UMMS storesdb — production stack: the secured Node app behind an nginx TLS proxy.
#
#   1. deploy/apply-port.sh /path/to/storesdb        # port your app in place
#   2. cp deploy/.env.production.example deploy/.env  # fill it in
#   3. put your TLS cert/key in deploy/certs/          # fullchain.pem + privkey.pem
#   4. APP_SRC=/path/to/storesdb docker compose -f deploy/docker-compose.yml up -d --build
#
services:
  app:
    build:
      context: ${APP_SRC:-./app}      # your ported storesdb app dir
      dockerfile: ${PWD}/deploy/Dockerfile
    restart: unless-stopped
    env_file: [./.env]
    environment:
      PORT: "4000"
      INVENTORY_DB: /data/inventory.db
    volumes:
      - umms-data:/data               # inventory.db persists here (seed/copy it in — see RUNBOOK)
    expose:
      - "4000"
    # No published port: only nginx talks to the app.

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/umms.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro   # fullchain.pem + privkey.pem
      - ./certbot-webroot:/var/www/certbot:ro   # optional: Let's Encrypt HTTP-01 challenges

volumes:
  umms-data:
