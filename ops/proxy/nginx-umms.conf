# UMMS — TLS reverse proxy (nginx). Terminates HTTPS, forwards to the app on 127.0.0.1:4000.
# Deploy: put certs in place (certbot or internal CA), copy to /etc/nginx/conf.d/umms.conf, `nginx -t && systemctl reload nginx`.
# Pair with the app: set NODE_ENV=production (Secure cookies) and trust this proxy (app.set('trust proxy', 1)).

# --- login brute-force throttle (belt-and-braces with the app's own limiter) ---
limit_req_zone $binary_remote_addr zone=umms_login:10m rate=10r/m;

# HTTP -> HTTPS
server {
    listen 80;
    server_name umms.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }   # cert renewal
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name umms.example.com;

    # --- TLS (modern; Mozilla "intermediate") ---
    ssl_certificate     /etc/letsencrypt/live/umms.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/umms.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # --- security headers ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options   "nosniff" always;
    add_header X-Frame-Options          "DENY" always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy   "default-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    server_tokens off;

    client_max_body_size 20m;                 # battery serial photos / attachment uploads
    gzip on; gzip_types application/json text/css application/javascript;

    # tighter throttle on the login endpoint
    location = /auth/login {
        limit_req zone=umms_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:4000;
        include /etc/nginx/proxy_params;      # or the proxy_set_header block below
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # app reads this to keep cookies Secure
        proxy_read_timeout 60s;
    }
}
